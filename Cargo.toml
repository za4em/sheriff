[package]
name = "sheriff"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3.0", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.12.1"
sha2 = "0.10.9"
lapin = { version = "4.12.3", default-features = false, features = ["tokio"] }
futures-lite = "2.6.1"
